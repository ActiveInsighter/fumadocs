name: Vercel Production Deployment
run-name: Vercel Production ${{ github.run_id }} · ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fumadocs-vercel-production
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_NAME: fumadocs
  NODE_OPTIONS: --max-old-space-size=12288
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Build on GitHub and deploy to Vercel
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel credentials
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || {
            echo "::error title=Missing secret::VERCEL_TOKEN is empty."
            exit 1
          }
          test -n "$VERCEL_ORG_ID" || {
            echo "::error title=Missing secret::VERCEL_ORG_ID is empty."
            exit 1
          }

      - name: Link existing Vercel project
        shell: bash
        run: |
          rm -rf .vercel
          vercel link \
            --yes \
            --project="$VERCEL_PROJECT_NAME" \
            --team="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"

      - name: Pull Vercel production settings
        run: >-
          vercel pull
          --yes
          --environment=production
          --team="$VERCEL_ORG_ID"
          --token="$VERCEL_TOKEN"

      - name: Build production output
        run: >-
          vercel build
          --prod
          --team="$VERCEL_ORG_ID"
          --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production output
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy \
            --prebuilt \
            --prod \
            --archive=tgz \
            --team="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN")"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel production deployment"
            echo
            echo "${deployment_url}"
          } >> "$GITHUB_STEP_SUMMARY"
