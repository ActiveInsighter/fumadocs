name: Run ID Index
run-name: Index run ${{ github.run_id }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: run-id-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Capture workflow run IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Capture run metadata
        uses: ./.github/actions/run-metadata
        with:
          phase: snapshot
          limit: "10"
