name: Build and Deploy Cloudflare Pages
run-name: Pages ${{ github.run_id }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write
  issues: write

concurrency:
  group: fumadocs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Validate, build, and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_ALGOLIA_APP_ID: ${{ vars.VITE_ALGOLIA_APP_ID }}
      VITE_ALGOLIA_SEARCH_API_KEY: ${{ vars.VITE_ALGOLIA_SEARCH_API_KEY }}
      VITE_ALGOLIA_INDEX_NAME: ${{ vars.VITE_ALGOLIA_INDEX_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture starting Run ID
        uses: ./.github/actions/run-metadata
        with:
          phase: start
          limit: "10"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm types:check

      - name: Build static site
        run: pnpm build

      - name: Verify Pages output
        run: |
          test -d build/client
          test -f build/client/index.html
          echo "Static output ready in build/client"
          find build/client -maxdepth 3 -type f | sort | head -n 80

      - name: Deploy production to Cloudflare Pages
        id: deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/client --project-name=fumadocs --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture final Run ID and status
        if: always()
        uses: ./.github/actions/run-metadata
        with:
          phase: complete
          limit: "10"
