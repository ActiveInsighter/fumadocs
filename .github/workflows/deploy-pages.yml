name: Deploy Cloudflare Pages
run-name: Deploy Pages ${{ github.run_id }} · ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write
  issues: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME || 'fumadocs' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Capture starting Run ID
        uses: ./.github/actions/run-metadata
        with:
          phase: pages-start
          limit: "10"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Validate Cloudflare configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PAGES_PROJECT_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing Cloudflare configuration::$name is not configured."
              missing=1
            fi
          done

          if [[ ! "${PAGES_PROJECT_NAME:-}" =~ ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "::error title=Invalid Pages project name::Use lowercase letters, numbers, and hyphens only."
            missing=1
          fi

          (( missing == 0 ))

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Resolve Pages project
        shell: bash
        run: |
          set -euo pipefail

          projects_json="$(pnpm exec wrangler pages project list --json)"
          exists="$(
            jq -r --arg name "$PAGES_PROJECT_NAME" '
              if type == "array" then
                any(.[]; .name == $name)
              elif type == "object" and (.result | type) == "array" then
                any(.result[]; .name == $name)
              else
                false
              end
            ' <<< "$projects_json"
          )"

          if [[ "$exists" == "true" ]]; then
            echo "Pages project '$PAGES_PROJECT_NAME' already exists."
          else
            echo "Creating Pages project '$PAGES_PROJECT_NAME'."
            pnpm exec wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch main
          fi

      - id: deploy
        name: Deploy production site
        shell: bash
        run: |
          set -euo pipefail

          deploy_log="${RUNNER_TEMP}/pages-deploy.log"
          pnpm exec wrangler pages deploy out \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            2>&1 | tee "$deploy_log"

          deployment_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.pages\.dev' "$deploy_log" | tail -n 1 || true)"
          if [[ -z "$deployment_url" ]]; then
            deployment_url="https://${PAGES_PROJECT_NAME}.pages.dev"
          fi

          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Cloudflare Pages deployment"
            echo
            echo "- Project: \`$PAGES_PROJECT_NAME\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 6 \
            --retry-delay 5 \
            --retry-all-errors \
            "$DEPLOYMENT_URL" \
            >/dev/null

      - name: Capture final Run ID and status
        if: ${{ always() }}
        uses: ./.github/actions/run-metadata
        with:
          phase: pages-complete
          limit: "10"
