name: CI
run-name: CI ${{ github.run_id }} · ${{ github.ref_name }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: fumadocs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fumadocs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The optimized Webpack build exceeded 6 GiB while the runner still had
      # more than 6 GiB available. Keep enough V8 headroom without consuming
      # the full 15 GiB runner memory.
      NODE_OPTIONS: --max-old-space-size=10240
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture starting Run ID
        uses: ./.github/actions/run-metadata
        with:
          phase: start
          limit: "10"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # `next build` already performs the production TypeScript validation.
      # Running `fumadocs-mdx` separately compiled the entire question bank twice.
      - name: Build with resource telemetry
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Initial runner resources"
          free -h
          df -h .
          echo "::endgroup::"

          pnpm build &
          build_pid=$!

          while kill -0 "$build_pid" 2>/dev/null; do
            echo "::group::Build resources $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            free -h
            ps -eo pid,ppid,rss,%mem,etime,cmd --sort=-rss | head -n 15 || true
            echo "::endgroup::"
            sleep 30
          done

          wait "$build_pid"

      - name: Capture final Run ID and status
        if: ${{ always() }}
        uses: ./.github/actions/run-metadata
        with:
          phase: complete
          limit: "10"
