name: CI
run-name: CI ${{ github.run_id }} · ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: fumadocs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Capture starting Run ID
        uses: ./.github/actions/run-metadata
        with:
          phase: start
          limit: "10"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm types:check

      - name: Build
        run: pnpm build

      - name: Capture final Run ID and status
        if: ${{ always() }}
        uses: ./.github/actions/run-metadata
        with:
          phase: complete
          limit: "10"
